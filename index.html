<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Hi，Liwen</title>
<style>
  :root{
    --ink:#1c1c1e;
    --ink-soft:#8e8e93;
    --accent:#007aff;
    /* 唱片直径：改这一个数字，唱片、封面、按钮、文字位置全部跟着等比缩放 */
    --dial:240px;
    --pp:0%;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:#ffffff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
    -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
  }
  .stage{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}

  /* ---------- 全屏背景 ---------- */
  .bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
      opacity:0;transition:opacity .9s ease;will-change:opacity;z-index:0}
  .bg.show{opacity:1}
  .vig{position:absolute;left:0;right:0;z-index:1;opacity:0;transition:opacity .8s ease;pointer-events:none}
  .vig-t{top:0;height:150px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0))}
  .vig-b{bottom:0;height:240px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.48))}
  .stage.on-image .vig{opacity:1}

  /* ---------- 顶部 ---------- */
  .topbar{position:relative;z-index:3;padding:calc(env(safe-area-inset-top) + 16px) 22px 0}
  .brand{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.3;transition:color .7s ease,text-shadow .7s ease}
  .brand-sub{margin-top:5px;font-size:12px;letter-spacing:.4px;color:var(--ink-soft);transition:color .7s ease,text-shadow .7s ease}
  .stage.on-image .brand{color:#fff;text-shadow:0 1px 16px rgba(0,0,0,.5)}
  .stage.on-image .brand-sub{color:rgba(255,255,255,.85);text-shadow:0 1px 16px rgba(0,0,0,.5)}

  .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--dial) * .8 + 76px);z-index:3;
        text-align:center;padding:0 30px;font-size:13px;color:var(--ink-soft);line-height:1.6;
        transition:opacity .5s ease,color .7s ease}
  .hint.gone{opacity:0}
  .stage.on-image .hint{color:rgba(255,255,255,.85);text-shadow:0 1px 14px rgba(0,0,0,.5)}

  /* ---------- 唱片信息 ---------- */
  .capt{position:absolute;right:22px;
        bottom:calc(env(safe-area-inset-bottom) + var(--dial) * .8 + 14px);
        width:200px;text-align:right;z-index:4;pointer-events:none}
  .capt-name{font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.2px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
             transition:color .7s ease,text-shadow .7s ease}
  .capt-artist{margin-top:3px;font-size:12.5px;color:var(--ink-soft);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
               transition:color .7s ease,text-shadow .7s ease}
  .capt-now{margin-top:6px;font-size:11.5px;color:var(--ink-soft);opacity:0;transition:opacity .3s ease,color .7s ease}
  .capt-now.show{opacity:.85}
  .stage.on-image .capt-name{color:#fff;text-shadow:0 1px 16px rgba(0,0,0,.5)}
  .stage.on-image .capt-artist,
  .stage.on-image .capt-now{color:rgba(255,255,255,.85);text-shadow:0 1px 16px rgba(0,0,0,.5)}

  /* ---------- 黑胶唱片 ---------- */
  /* 圆心固定在屏幕右下角内侧 0.6R 处，唱片露出约四分之三；偏移量随直径等比变化 */
  .dial{position:absolute;right:calc(var(--dial) * -.2);bottom:calc(var(--dial) * -.2);
        width:var(--dial);height:var(--dial);z-index:4;touch-action:none}
  .disc-rot{position:absolute;inset:0;will-change:transform}
  .disc-spin{
    position:absolute;inset:0;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.055) 0 1px, rgba(255,255,255,0) 1px 6px),
      conic-gradient(from 0deg,
        rgba(255,255,255,.14) 0deg, rgba(255,255,255,.02) 24deg, rgba(255,255,255,0) 66deg,
        rgba(255,255,255,0) 114deg, rgba(255,255,255,.02) 156deg, rgba(255,255,255,.14) 180deg,
        rgba(255,255,255,.02) 204deg, rgba(255,255,255,0) 246deg, rgba(255,255,255,0) 294deg,
        rgba(255,255,255,.02) 336deg, rgba(255,255,255,.14) 360deg),
      #16161a;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), 0 12px 44px rgba(0,0,0,.40);
  }
  .disc-spin.singing{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .ring{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(var(--accent) 0% var(--pp), rgba(255,255,255,.18) var(--pp) 100%);
    -webkit-mask:radial-gradient(circle, transparent 91%, #000 92%);
    mask:radial-gradient(circle, transparent 91%, #000 92%);
    opacity:0;transition:opacity .5s ease;
  }
  .ring.show{opacity:1}

  .cover{position:absolute;left:calc(var(--dial) * .293);top:calc(var(--dial) * .293);
         width:calc(var(--dial) * .414);height:calc(var(--dial) * .414);border-radius:50%;overflow:hidden;
         box-shadow:0 6px 22px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.14)}
  .cover-layer{position:absolute;inset:0;background-size:cover;background-position:center;
               opacity:0;transition:opacity .4s ease}
  .cover-layer.on{opacity:1}
  .cover-mask{position:absolute;inset:0;background:rgba(0,0,0,.28);transition:background .4s ease}
  .stage.playing .cover-mask{background:rgba(0,0,0,.10)}

  .cbtn{position:absolute;left:calc(var(--dial) * .4);top:calc(var(--dial) * .4);
        width:calc(var(--dial) * .2);height:calc(var(--dial) * .2);border-radius:50%;
        background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 0 0 1px rgba(255,255,255,.28)}
  .cbtn svg{width:calc(var(--dial) * .079);height:calc(var(--dial) * .079);fill:#fff;display:block}
  .cbtn .ico-pause{display:none}
  .stage.sel-playing .cbtn .ico-play{display:none}
  .stage.sel-playing .cbtn .ico-pause{display:block}

  @media (min-width:560px){
    .stage{max-width:520px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.08)}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="vig vig-t"></div>
  <div class="vig vig-b"></div>

  <header class="topbar">
    <div class="brand" id="brand">Hi , Liwen</div>
    <div class="brand-sub" id="brandSub">你的長夏，永不凋零</div>
  </header>

  <div class="capt">
    <div class="capt-name" id="capName"></div>
    <div class="capt-artist" id="capArtist"></div>
    <div class="capt-now" id="capNow"></div>
  </div>

  <div class="dial" id="dial">
    <div class="disc-rot" id="discRot">
      <div class="disc-spin" id="discSpin"></div>
    </div>
    <div class="ring" id="ring"></div>
    <div class="cover">
      <div class="cover-layer" id="covA"></div>
      <div class="cover-layer" id="covB"></div>
      <div class="cover-mask"></div>
    </div>
    <div class="cbtn" id="cbtn">
      <svg class="ico-play" viewBox="0 0 22 22"><path d="M6 3.2 18.4 11 6 18.8z"/></svg>
      <svg class="ico-pause" viewBox="0 0 22 22"><rect x="6" y="4" width="3.6" height="14" rx="1.1"/><rect x="12.4" y="4" width="3.6" height="14" rx="1.1"/></svg>
    </div>
  </div>
</div>

<script>
/* =========================================================
   配置区：改这里就能换内容，改完保存刷新即可
   —— name    歌名
   —— artist  歌手 / 表演者
   —— audio   音频文件路径
   —— bg      这首歌对应的全屏背景图
   —— cover   这首歌的专辑封面（显示在唱片中心）
   加歌多复制一行，减歌删整行，数量不限
   ========================================================= */
var CONFIG = {
  title: "Hi，Liwen",
  accent: "#007aff",
  // 背景图池：每次点击播放从中随机取一张，且不与上一张相同
  backgrounds: [
    "images/bg1.jpg",
    "images/bg2.jpg",
    "images/bg3.jpg",
    "images/bg4.jpg",
    "images/bg5.jpg",
    "images/bg6.jpg",
    "images/bg7.jpg"
  ],
  tracks: [
    { name: "Try", artist: "Asher Monroe", audio: "audio/track1.mp3", cover: "images/cover1.jpg" },
    { name: "Saddle of My Heart", artist: "Teloupe", audio: "audio/track2.mp3", cover: "images/cover2.jpg" },
    { name: "今晩はお月さん (今夜月绮丽)", artist: "humbert", audio: "audio/track3.mp3", cover: "images/cover3.jpg" },
    { name: "Time Machine", artist: "mj apanay,aren park", audio: "audio/track4.mp3", cover: "images/cover4.jpg" },
    { name: "Roses and Gold", artist: "Robin Jackson", audio: "audio/track5.mp3", cover: "images/cover5.jpg" },
    { name: "Walk On Memories (梦回暮夜)", artist: "EXO", audio: "audio/track6.mp3", cover: "images/cover6.jpg" }
  ]
};

(function () {
  var stage = document.getElementById('stage');
  var dial = document.getElementById('dial');
  var discRot = document.getElementById('discRot');
  var discSpin = document.getElementById('discSpin');
  var ring = document.getElementById('ring');
  var covA = document.getElementById('covA');
  var covB = document.getElementById('covB');
  var capName = document.getElementById('capName');
  var capArtist = document.getElementById('capArtist');
  var capNow = document.getElementById('capNow');

  document.title = CONFIG.title;
  document.getElementById('brand').textContent = CONFIG.title;
  document.documentElement.style.setProperty('--accent', CONFIG.accent);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', CONFIG.accent);

  var N = CONFIG.tracks.length;
  var PER = 360 / N;                 // 每首歌对应唱片转过的角度：转满一圈 = 歌单循环一轮

  // 几何尺寸全部由 CSS 变量 --dial 推导，改直径即可整体等比缩放
  var rootCS = getComputedStyle(document.documentElement);
  var SIZE = 240, C = 120, COVER_HIT = 53;
  function readSize() {
    var v = parseFloat(rootCS.getPropertyValue('--dial'));
    if (!v || isNaN(v)) v = 240;
    SIZE = v; C = v / 2; COVER_HIT = v * 0.22;
  }
  readSize();
  window.addEventListener('resize', function () { readSize(); render(); });

  /* ---------- 音频 ---------- */
  var items = CONFIG.tracks.map(function (t, idx) {
    var a = new Audio(t.audio);
    a.preload = 'metadata';
    a.setAttribute('playsinline', '');
    a.setAttribute('webkit-playsinline', '');
    var rec = { audio: a, dur: 0, idx: idx };
    a.addEventListener('loadedmetadata', function () { rec.dur = a.duration; refreshMeta(); });
    a.addEventListener('timeupdate', function () { if (playingIdx === idx) tick(); });
    a.addEventListener('ended', function () { onEnded(idx); });
    a.addEventListener('playing', function () { playingIdx = idx; setPlayVisual(true); });
    a.addEventListener('pause', function () { if (playingIdx === idx) setPlayVisual(false); });
    a.addEventListener('error', function () { rec.err = true; refreshMeta(); });
    return rec;
  });

  CONFIG.tracks.forEach(function (t) {
    if (t.cover) { var i2 = new Image(); i2.src = t.cover; }
  });
  (CONFIG.backgrounds || []).forEach(function (u) { var ib = new Image(); ib.src = u; });

  /* ---------- 背景（7 张随机池：每次点播放换一张，绝不与上一张相同）---------- */
  var layerA = document.getElementById('bgA'), layerB = document.getElementById('bgB');
  var front = layerA, lastBg = -1;
  function showBgImage(url) {
    var next = (front === layerA) ? layerB : layerA;
    next.style.backgroundImage = 'url("' + url + '")';
    void next.offsetWidth;
    next.classList.add('show');
    front.classList.remove('show');
    front = next;
    stage.classList.add('on-image');
  }
  function setRandomBackground() {
    var pool = CONFIG.backgrounds || [];
    if (!pool.length) return;
    var n = pool.length, idx;
    if (n === 1) { idx = 0; }
    else if (lastBg < 0) { idx = Math.floor(Math.random() * n); }
    else { idx = (lastBg + 1 + Math.floor(Math.random() * (n - 1))) % n; }
    lastBg = idx;
    showBgImage(pool[idx]);
  }

  /* ---------- 状态 ---------- */
  var ci = 0, selected = 0, playingIdx = -1, coverFront = null;

  function fmt(s) {
    if (!isFinite(s) || s <= 0) return '--:--';
    var mm = Math.floor(s / 60), ss = Math.floor(s % 60);
    return mm + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function setCover(i) {
    var url = CONFIG.tracks[i].cover;
    if (!url) return;
    var next = (coverFront === covA) ? covB : covA;
    next.style.backgroundImage = 'url("' + url + '")';
    next.classList.add('on');
    var prev = (next === covA) ? covB : covA;
    prev.classList.remove('on');
    coverFront = next;
  }

  function refreshMeta() {
    var t = CONFIG.tracks[selected];
    var r = items[selected];
    capName.textContent = t.name || '';
    capArtist.textContent = (t.artist || '') + (r.dur ? ' · ' + fmt(r.dur) : (r.err ? ' · 缺失' : ''));
    refreshNow();
    refreshBtn();
  }
  // 按钮只反映"当前选中这一首"是否在播，避免播放中切歌时图标误导
  function refreshBtn() {
    var cur = items[selected];
    var on = (playingIdx === selected) && cur && !cur.audio.paused;
    stage.classList.toggle('sel-playing', !!on);
  }
  function refreshNow() {
    if (playingIdx >= 0 && playingIdx !== selected) {
      capNow.textContent = '正在播放：' + (CONFIG.tracks[playingIdx].name || '');
      capNow.classList.add('show');
    } else {
      capNow.classList.remove('show');
    }
  }

  function render() {
    discRot.style.transform = 'rotate(' + (ci * PER).toFixed(2) + 'deg)';
    var near = ((Math.round(ci) % N) + N) % N;
    if (near !== selected) {
      selected = near;
      setCover(near);
      refreshMeta();
      // 播放中不打断：只更新显示，声音照旧
    }
  }

  /* ---------- 播放控制 ---------- */
  function setProgress(p) {
    ring.style.setProperty('--pp', Math.max(0, Math.min(100, p)).toFixed(1) + '%');
  }
  function tick() {
    var a = items[playingIdx].audio;
    if (!a.duration) return;
    setProgress(a.currentTime / a.duration * 100);
  }
  function setPlayVisual(on) {
    stage.classList.toggle('playing', !!on);
    discSpin.classList.toggle('singing', !!on);
    ring.classList.toggle('show', !!on);
    if (!on) setProgress(0);
    refreshNow();
    refreshMeta();
  }
  function onEnded(idx) {
    stage.classList.remove('playing');
    discSpin.classList.remove('singing');
    ring.classList.remove('show');
    setProgress(0);
    playingIdx = -1;
    refreshNow();
    refreshBtn();
  }

  function stopCurrent() {
    if (playingIdx < 0) return;
    var a = items[playingIdx].audio;
    a.pause();
    try { a.currentTime = 0; } catch (e) {}
    playingIdx = -1;
  }

  function togglePlay() {
    var r = items[selected];
    if (playingIdx === selected && !r.audio.paused) { r.audio.pause(); return; }
    stopCurrent();                       // 换了歌才停，同一首不重置
    setRandomBackground();               // 每次点播放：随机换一张背景（不与上一张相同）
    var p = r.audio.play();
    if (p && p.catch) {
      p.catch(function () { console.warn('播放被浏览器拦截，请再点一次封面'); });
    }
  }

  /* ---------- 手势：转动唱片 ---------- */
  var dragging = false, inner = false, moved = 0, lastAng = 0, vel = 0, lastT = 0, anim = null;

  function local(e) {
    var r = dial.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (SIZE / r.width),
      y: (e.clientY - r.top) * (SIZE / r.height)
    };
  }
  function angOf(e) {
    var p = local(e);
    return Math.atan2(p.y - C, p.x - C) * 180 / Math.PI;
  }
  function dAng(a, b) {
    var d = a - b;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    return d;
  }

  dial.addEventListener('pointerdown', function (e) {
    if (anim) anim = null;
    var p = local(e);
    var dist = Math.sqrt((p.x - C) * (p.x - C) + (p.y - C) * (p.y - C));
    if (dist > C + 12) { inner = false; dragging = false; return; }
    inner = dist < COVER_HIT;
    dragging = !inner;
    moved = 0; vel = 0;
    lastAng = angOf(e); lastT = e.timeStamp || Date.now();
    try { dial.setPointerCapture(e.pointerId); } catch (err) {}
  });

  dial.addEventListener('pointermove', function (e) {
    if (!dragging && !inner) return;
    var a = angOf(e);
    var da = dAng(a, lastAng);
    var now = e.timeStamp || Date.now();
    var dt = Math.max(1, now - lastT);
    if (!dragging) {
      moved += Math.abs(da) * C * Math.PI / 180;
      if (moved > 10) dragging = true;
      else { lastAng = a; lastT = now; return; }
    }
    ci += da / PER;
    vel = da / dt;
    lastAng = a; lastT = now;
    render();
  });

  function endDrag() {
    if (!dragging) {
      if (inner) togglePlay();
      return;
    }
    dragging = false;
    glide();
  }
  dial.addEventListener('pointerup', endDrag);
  dial.addEventListener('pointercancel', endDrag);

  function glide() {
    if (Math.abs(vel) < 0.02) { snap(); return; }
    ci += vel * 16 / PER;
    vel *= 0.93;
    render();
    requestAnimationFrame(glide);
  }

  function snap() {
    var target = Math.round(ci);
    var start = ci, t0 = performance.now(), dur = 240, token = {};
    anim = token;
    (function frame(now) {
      if (anim !== token) return;
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      ci = start + (target - start) * e;
      render();
      if (p < 1) requestAnimationFrame(frame);
      else {
        ci = ((target % N) + N) % N;      // 归一化，避免角度无限累加
        anim = null;
        render();
      }
    })(performance.now());
  }

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { stepTo(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { stepTo(-1); }
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
  function stepTo(dir) {
    var start = ci, target = Math.round(ci) + dir;
    var t0 = performance.now(), dur = 260, token = {};
    anim = token;
    (function frame(now) {
      if (anim !== token) return;
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      ci = start + (target - start) * e;
      render();
      if (p < 1) requestAnimationFrame(frame);
      else { ci = ((target % N) + N) % N; anim = null; render(); }
    })(performance.now());
  }

  setCover(0);
  refreshMeta();
  render();
  setRandomBackground();   // 首屏就先随机铺一张背景
})();
</script>
</body>
</html>
